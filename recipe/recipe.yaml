context:
  version: "2.14.0"

package:
  name: mcp-inspector
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@modelcontextprotocol/inspector/-/inspector-${{ version }}.tgz
  sha256: eeefd17411ab28a239717692b8101366a5fddf9d79b2a2a4d1320b5fba705fd3

build:
  number: 0
  dynamic_linking:
    # npm ships prebuilt .node binaries that link nothing from $PREFIX;
    # relinking them fails on osx-64 due to missing header padding
    binary_relocation: false

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  host:
    - nodejs >=22.19.0
  run:
    - nodejs >=22.19.0

tests:
  - script:
      - npm list -g @modelcontextprotocol/inspector
      - mcp-inspector --help
      - mcpdo --help

about:
  homepage: https://modelcontextprotocol.io/docs/tools/inspector
  repository: https://github.com/modelcontextprotocol/inspector
  summary: Visual testing tool for MCP servers
  description: |
    The MCP Inspector is a developer tool for testing and debugging Model
    Context Protocol servers, with web, CLI and TUI clients.
  license: Apache-2.0 AND MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt

extra:
  recipe-maintainers:
    - moritzwilksch
